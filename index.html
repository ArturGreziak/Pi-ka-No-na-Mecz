<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piłka nożna — Mecz</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#091923;color:#eaf4fa;font-family:Arial,sans-serif}body{display:grid;place-items:center}#game{position:relative;width:min(1024px,100vw,calc(100dvh * 1024 / 733));aspect-ratio:1024/733;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#toolbar{position:absolute;right:2.4%;top:3.5%;display:flex;gap:8px}button,select{font:700 14px Arial;border:1px solid #ffffff35;border-radius:10px;padding:11px 15px;background:#173447;color:#fff;cursor:pointer}button:hover{background:#2c5364}button:focus-visible,select:focus-visible{outline:3px solid #ffd56b}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#051922c9;backdrop-filter:blur(5px)}#overlay.hidden{display:none}.panel{width:80%;max-width:520px;background:#102e40f5;border:1px solid #487183;border-radius:24px;padding:30px;text-align:center;box-shadow:0 30px 90px #0009}.tag{font-size:12px;letter-spacing:3px;color:#7ee6bc;font-weight:700}h1{font-size:38px;margin:14px 0}p{font-size:15px;line-height:1.6;color:#c8dce4}#start{background:#ffd56b;color:#162b36;padding:15px 28px;border:0;font-size:17px;margin-top:16px}label{font-size:13px}select{margin-left:10px}@media(max-width:600px){.panel{padding:14px}h1{font-size:23px;margin:8px}p{font-size:11px;line-height:1.4;margin:8px}button,select{padding:6px 9px;font-size:10px}#start{font-size:12px;padding:9px 16px;margin-top:9px}.tag{font-size:9px}label{font-size:10px}}</style></head><body><main id="game"><canvas id="pitch" width="1024" height="733" aria-label="Mecz piłki nożnej. Ruch WASD lub strzałkami, spacja strzał, X podanie, Q zmiana zawodnika."></canvas><div id="toolbar"><button id="pause">Pauza</button><button id="reset">Od nowa</button></div><section id="overlay"><div class="panel"><div class="tag">PIŁKA NOŻNA • 5 NA 5</div><h1 id="title">Czas na mecz!</h1><p id="info">Twoi <b>niebiescy</b> atakują bramkę po prawej.<br>Pokonaj czerwonych w dwuminutowym meczu!<br><br><b>WASD / strzałki</b> — ruch &nbsp; <b>SPACJA</b> — strzał<br><b>X</b> — podanie &nbsp; <b>Q</b> — zmiana piłkarza<br>Telefon: joystick i przyciski na dole.<br>Odbiór piłki następuje po zbliżeniu do rywala.</p><div id="settings"><label>Poziom<select id="difficulty"><option value="easy">Łatwy</option><option value="normal" selected>Normalny</option><option value="hard">Trudny</option></select></label></div><button id="start">Rozpocznij mecz →</button></div></section></main><script>
'use strict';
const canvas=document.getElementById('pitch'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const CFG={W:1024,H:733,left:48,right:976,top:137,bottom:601,goalTop:292,goalBottom:446,duration:120,run:166,shot:620,pass:390};
let state='menu',players=[],ball,owner=null,active=1,score=[0,0],time=120,phase='live',phaseTime=0,clock=0,kickLock=0,lastKicker=null,last=0,stealCooldown=0,notice='',noticeTime=0,difficulty='normal',restartTeam=1;
const keys=new Set();let stick=null,joy={x:0,y:0};
const homes=[[85,369],[330,274],[330,466],[510,320],[565,453]];
function formations(){players=[];for(let t=0;t<2;t++)homes.forEach(([x,y],i)=>players.push({x:t?1024-x:x,y,homeX:t?1024-x:x,homeY:y,t,keeper:i===0,n:i+1,dx:t?-1:1,dy:0}));}
function setupKickoff(team=0){formations();ball={x:512,y:369,vx:0,vy:0};players[3].x=470;players[3].y=369;players[8].x=554;players[8].y=369;owner=team===0?3:8;active=team===0?3:1;kickLock=.5;lastKicker=null;stealCooldown=1;phase='kickoff';phaseTime=1.25;joy={x:0,y:0};stick=null;keys.clear()}
function newGame(){difficulty=document.getElementById('difficulty').value;score=[0,0];time=CFG.duration;clock=0;notice='';setupKickoff(0);state='play';overlay.classList.add('hidden');document.getElementById('pause').textContent='Pauza';}
function show(title,text,label){document.getElementById('title').textContent=title;document.getElementById('info').innerHTML=text;document.getElementById('start').textContent=label;document.getElementById('settings').style.display=state==='pause'?'none':'block';overlay.classList.remove('hidden')}
function togglePause(){if(state==='play'){state='pause';keys.clear();joy={x:0,y:0};stick=null;show('Przerwa w meczu','Wynik i czas meczu zostały zachowane.','Wróć na boisko →');document.getElementById('pause').textContent='Wznów'}else if(state==='pause'){state='play';overlay.classList.add('hidden');document.getElementById('pause').textContent='Pauza'}}
function endGame(){state='end';owner=null;show(score[0]>score[1]?'Zwycięstwo!':score[0]<score[1]?'Czas na rewanż!':'Remis!',`Koniec meczu: <b>Niebiescy ${score[0]} : ${score[1]} Czerwoni</b><br>Wybierz poziom trudności i zagraj ponownie.`,'Zagraj ponownie →')}
document.getElementById('start').onclick=()=>state==='pause'?togglePause():newGame();document.getElementById('pause').onclick=togglePause;document.getElementById('reset').onclick=newGame;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function nearest(team,target=ball,exclude=-1){let best=-1,d=Infinity;players.forEach((p,i)=>{if(p.t===team&&!p.keeper&&i!==exclude&&dist(p,target)<d){best=i;d=dist(p,target)}});return best}
function switchPlayer(){if(state!=='play'||phase!=='live')return;if(owner!==null&&owner<5){notice='Najpierw podaj piłkę';noticeTime=1;return}const n=nearest(0);active=active===n?nearest(0,ball,n):n;}
function kick(pass=false){if(state!=='play'||phase!=='live'||owner===null||players[owner].t!==0)return;const p=players[owner];let dx,dy;if(pass){let others=players.map((q,i)=>({q,i})).filter(v=>v.q.t===0&&!v.q.keeper&&v.i!==owner);others.sort((a,b)=>(dist(p,a.q)+(a.q.x<p.x?140:0))-(dist(p,b.q)+(b.q.x<p.x?140:0)));const target=others[0];dx=target.q.x-p.x;dy=target.q.y-p.y;active=target.i;}else{dx=CFG.right-p.x;dy=clamp(369+p.dy*68,310,428)-p.y;notice='STRZAŁ!';noticeTime=.6}releaseBall(dx,dy,pass?CFG.pass:CFG.shot)}
function releaseBall(dx,dy,speed){const p=players[owner],n=Math.hypot(dx,dy)||1;ball.x=p.x+dx/n*22;ball.y=p.y+dy/n*22;ball.vx=dx/n*speed;ball.vy=dy/n*speed;lastKicker=owner;owner=null;kickLock=.23;stealCooldown=.32;}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyX','KeyQ'].includes(e.code))e.preventDefault();if(e.repeat&&['Space','KeyX','KeyQ','KeyP','Escape'].includes(e.code))return;if(e.code==='KeyP'||e.code==='Escape'){togglePause();return}if(state!=='play')return;keys.add(e.code);if(e.code==='Space')kick();if(e.code==='KeyX')kick(true);if(e.code==='KeyQ')switchPlayer()});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{if(state==='play')togglePause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
function pointer(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*1024/r.width,y:(e.clientY-r.top)*733/r.height}}
canvas.addEventListener('pointerdown',e=>{if(state!=='play')return;let p=pointer(e);canvas.setPointerCapture(e.pointerId);if(p.x<240&&p.y>615){stick={id:e.pointerId};moveStick(p)}else if(Math.hypot(p.x-920,p.y-670)<46)kick();else if(Math.hypot(p.x-817,p.y-670)<39)kick(true);else if(Math.hypot(p.x-722,p.y-670)<34)switchPlayer();e.preventDefault()});
function moveStick(p){let dx=p.x-106,dy=p.y-670,n=Math.max(42,Math.hypot(dx,dy));joy={x:clamp(dx/n,-1,1),y:clamp(dy/n,-1,1)}}
canvas.addEventListener('pointermove',e=>{if(stick&&stick.id===e.pointerId)moveStick(pointer(e))});function releasePointer(e){if(stick&&stick.id===e.pointerId){stick=null;joy={x:0,y:0}}}canvas.addEventListener('pointerup',releasePointer);canvas.addEventListener('pointercancel',releasePointer);
function move(p,dx,dy,speed,dt){let n=Math.hypot(dx,dy);if(n>.05){let m=Math.min(n,1);p.x+=dx/n*speed*m*dt;p.y+=dy/n*speed*m*dt;p.dx=dx/n;p.dy=dy/n}p.x=clamp(p.x,63,961);p.y=clamp(p.y,152,586)}
function chase(p,target,speed,dt){let dx=target.x-p.x,dy=target.y-p.y,n=Math.hypot(dx,dy);if(n>4)move(p,dx/n,dy/n,speed*Math.min(1,n/35),dt)}
function goal(team){restartTeam=1-team;score[team]++;phase='goal';phaseTime=2;notice=team===0?'GOOOL! NIEBIESCY':'GOL DLA CZERWONYCH';noticeTime=2;owner=null;ball.vx=ball.vy=0;kickLock=0;}
function update(dt){if(state!=='play')return;clock+=dt;noticeTime=Math.max(0,noticeTime-dt);if(phase!=='live'){phaseTime-=dt;if(phaseTime<=0){if(phase==='goal')setupKickoff(restartTeam);else phase='live'}return}
time=Math.max(0,time-dt);if(time<=0){endGame();return}kickLock=Math.max(0,kickLock-dt);stealCooldown=Math.max(0,stealCooldown-dt);
const aiSpeed=difficulty==='easy'?112:difficulty==='hard'?163:139;
let mx=joy.x+(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0),my=joy.y+(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0);if(Math.hypot(mx,my)>1){const n=Math.hypot(mx,my);mx/=n;my/=n}move(players[active],mx,my,CFG.run,dt);
const chasers=[nearest(0),nearest(1)];players.forEach((p,i)=>{if(i===active)return;if(p.keeper){const x=p.t?947:77,y=clamp(ball.y,306,432);chase(p,{x,y},p.t?aiSpeed*1.12:170,dt);return}if(owner===i&&p.t===1){if(p.x<345&&Math.abs(p.y-369)<140&&kickLock===0){releaseBall(-1,(clamp(369+(Math.sin(clock*2)*56),310,428)-p.y)/Math.max(1,p.x-48),480);return}const nearestDef=players[nearest(0,p)],d=dist(p,nearestDef);chase(p,{x:110,y:369+(d<85?(p.y<nearestDef.y?-90:90):0)},aiSpeed,dt);return}if(i===chasers[p.t]&&(owner===null||players[owner].t!==p.t)){chase(p,owner===null?ball:players[owner],p.t?aiSpeed:142,dt)}else{let attack=owner!==null&&players[owner].t===p.t;const x=clamp(p.homeX+(ball.x-512)*.22+(attack?(p.t?-100:100):0),135,889);chase(p,{x,y:clamp(p.homeY+(ball.y-369)*.2,175,565)},p.t?aiSpeed*.75:128,dt)}});
// Separate overlapping bodies, preserving the selected player's responsiveness.
for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){let a=players[i],b=players[j],dx=b.x-a.x,dy=b.y-a.y,n=Math.hypot(dx,dy);if(n>0&&n<25){let push=(25-n)*.5;a.x-=dx/n*push;a.y-=dy/n*push;b.x+=dx/n*push;b.y+=dy/n*push;}}
if(owner!==null){let p=players[owner];if(stealCooldown===0){let candidate=players.findIndex((q,i)=>q.t!==p.t&&dist(p,q)<31);if(candidate>=0){owner=candidate;p=players[owner];stealCooldown=.85;if(p.t===0&&!p.keeper)active=owner;}}
if(p.keeper){releaseBall(p.t?-1:1,(369-p.y)/700,410)}else{ball.x=p.x+p.dx*18;ball.y=p.y+p.dy*18;ball.vx=ball.vy=0;}}
else{let ox=ball.x,oy=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const decay=Math.exp(-.36*dt);ball.vx*=decay;ball.vy*=decay;
if(ball.x<48||ball.x>976){let t=(ball.x<48?48-ox:976-ox)/(ball.x-ox),crossY=oy+(ball.y-oy)*clamp(t,0,1);if(crossY>CFG.goalTop+7&&crossY<CFG.goalBottom-7){let team=ball.x>976?0:1;goal(team);return}ball.x=clamp(ball.x,49,975);ball.vx*=-.7;}
if(ball.y<137||ball.y>601){ball.y=clamp(ball.y,138,600);ball.vy*=-.7}
let catcher=-1,best=24;players.forEach((p,i)=>{if(i===lastKicker&&kickLock>0)return;if(!p.keeper&&kickLock>0)return;let d=dist(p,ball);if(d<best){catcher=i;best=d}});if(catcher>=0){owner=catcher;stealCooldown=.6;if(players[catcher].t===0&&!players[catcher].keeper)active=catcher;}}
}
function box(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function text(s,x,y,size=16,color='#fff',align='left'){ctx.fillStyle=color;ctx.font=`700 ${size}px Arial`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function football(x,y){circle(x+2,y+3,9,'#0004');circle(x,y,8,'#fff');circle(x,y,3,'#182e3b');for(let i=0;i<5;i++){let a=i*Math.PI*.4;circle(x+6*Math.cos(a),y+6*Math.sin(a),1.7,'#182e3b')}}
function drawPlayer(p,i){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(3,6,18,11,0,0,7);ctx.fill();if(i===active){ctx.strokeStyle='#ffe07c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,23,0,7);ctx.stroke();ctx.fillStyle='#ffe07c';ctx.beginPath();ctx.moveTo(-5,-32);ctx.lineTo(5,-32);ctx.lineTo(0,-25);ctx.fill()}
ctx.rotate(Math.atan2(p.dy,p.dx)+Math.PI/2);let c=p.keeper?(p.t?'#a4efb3':'#ffd66f'):(p.t?'#f25f70':'#64b6ff');box(-10,3,8,13,3,'#122c3f');box(2,3,8,13,3,'#122c3f');box(-19,-6,38,11,5,c);box(-12,-12,24,24,7,c);circle(0,-5,8,'#e6b08c');ctx.fillStyle='#2a2833';ctx.beginPath();ctx.arc(0,-7,7,Math.PI,Math.PI*2);ctx.fill();ctx.restore();text(p.n,p.x,p.y+36,10,'#dbeadb','center');}
function action(x,r,label,key,color){circle(x,670,r,'#153647');ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,670,r,0,7);ctx.stroke();text(label,x,674,13,color,'center');text(key,x,725,10,'#86a6b5','center')}
function draw(){ctx.fillStyle='#0a1e2b';ctx.fillRect(0,0,1024,733);text('MATCHDAY / ARCADE',28,29,11,'#7ee6bc');text('PIŁKA NOŻNA',28,58,26);text('PEŁNY MECZ • 5 NA 5',29,82,11,'#9db8c7');box(334,20,356,83,18,'#163547');circle(364,52,6,'#64b6ff');circle(660,52,6,'#f25f70');text('NIEBIESCY',419,42,11,'#9bccf5','center');text('CZERWONI',604,42,11,'#ffb2bd','center');text(score[0]+' : '+score[1],512,65,31,'#fff','center');text('ATAK →',419,66,10,'#98bbcf','center');text('← ATAK',604,66,10,'#98bbcf','center');let sec=Math.ceil(time);text(Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),512,89,14,'#ffe08b','center');
box(25,115,974,508,23,'#173d3d');ctx.save();ctx.beginPath();ctx.roundRect(38,127,948,484,12);ctx.clip();for(let i=0;i<14;i++){ctx.fillStyle=i%2?'#267a53':'#2a8259';ctx.fillRect(38+i*68,127,68,484)}ctx.restore();ctx.strokeStyle='#d1e6c3a6';ctx.lineWidth=2;ctx.strokeRect(48,137,928,464);ctx.beginPath();ctx.moveTo(512,137);ctx.lineTo(512,601);ctx.stroke();ctx.beginPath();ctx.arc(512,369,68,0,7);ctx.stroke();circle(512,369,3,'#e0e8cb');ctx.strokeRect(48,242,140,254);ctx.strokeRect(836,242,140,254);ctx.strokeRect(48,304,48,130);ctx.strokeRect(928,304,48,130);circle(146,369,3,'#e0e8cb');circle(878,369,3,'#e0e8cb');for(const x of [20,976]){box(x,292,28,154,2,'#b8d3ce');box(x+3,295,22,148,1,'#1b3841');ctx.strokeStyle='#95b8b477';ctx.lineWidth=1;for(let y=300;y<446;y+=12){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+28,y);ctx.stroke()}ctx.strokeStyle='#f6f5e6';ctx.lineWidth=4;ctx.strokeRect(x,292,28,154)}
players.forEach(drawPlayer);football(ball.x,ball.y);if(phase==='kickoff'||noticeTime>0){const s=phase==='kickoff'?'GOTOWI? GRAMY!':notice;box(330,544,364,43,12,'#102b3ce8');text(s,512,572,19,'#ffe08b','center')}
circle(106,670,43,'#173b4a');ctx.strokeStyle='#507486';ctx.lineWidth=2;ctx.beginPath();ctx.arc(106,670,43,0,7);ctx.stroke();circle(106+joy.x*23,670+joy.y*23,20,'#6ba7bf');text('RUCH',178,660,12,'#d9e6ec');text('WASD / STRZAŁKI',178,681,11,'#8faebe');text('Atakuj w prawo. Podejdź do rywala, aby odebrać piłkę.',275,650,12,'#aec4cf');text('SPACJA strzał   •   X podanie   •   Q zmiana   •   P pauza',275,673,11,'#7899ac');text('2 MINUTY / BEZ AUTÓW / SZYBKA GRA',275,701,10,'#7ee6bc');action(722,31,'ZMIANA','Q','#b5c9d8');action(817,36,'PODAJ','X','#85d5ff');action(920,44,'STRZAŁ','SPACJA','#ffe08b');}
function frame(t){let dt=Math.min(.1,(t-last)/1000||0);last=t;while(dt>0){let step=Math.min(dt,1/120);update(step);dt-=step}draw();requestAnimationFrame(frame)}formations();ball={x:512,y:369,vx:0,vy:0};requestAnimationFrame(frame);
</script></body></html>
